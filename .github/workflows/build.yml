name: Build release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Minify
        run: bash minify.sh

      - name: Next version
        id: version
        run: |
          last=$(git tag --list 'v*.*.*.*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            next="1.0.0.0"
          else
            IFS=. read -r a b c d <<< "${last#v}"
            next="$a.$b.$c.$((d + 1))"
          fi
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Версия: v$next"

      - name: Pack archive
        run: |
          mkdir -p dist
          zip -r "dist/amway-poll-${{ steps.version.outputs.tag }}.zip" \
            assets app.min.js style.min.css README.md index.html -x "*.DS_Store"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/amway-poll-${{ steps.version.outputs.tag }}.zip" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
