first:
  title: Онлайн оношилгоо
  description: |-
    Өөрийн энерги болон нөхөн сэргэх түвшнээ шалгаарай.
    Заримдаа ядаргаа анзаарагдахгүйгээр хуримтлагддаг — энэхүү богино асуулга* нь анхаарах шаардлагатай шинж тэмдэг байгаа эсэхийг ойлгоход тань тусална.
  start: Эхлэх
  disclaimer: Академич Е.Д. Даленовын нэрэмжит Урьдчилан сэргийлэх анагаах ухааны эрдэм шинжилгээ, судалгааны хүрээлэнтэй хамтран боловсруулав
  note: '*Энэхүү асуумжийн үр дүн нь зөвхөн мэдээллийн зорилготой бөгөөд эмнэлгийн онош биш болно. Асуумж нь эрүүл мэндийнхээ байдлын талаарх мэдлэг, ойлголтыг нэмэгдүүлэх зорилготой бөгөөд мэргэжлийн эмч, эмнэлгийн ажилтны зөвлөгөөг орлохгүй.'
