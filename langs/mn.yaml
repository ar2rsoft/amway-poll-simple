questions:
  - Та ядарч сульдах, эрч хүч буурах эсвэл өөрийгөө сэргээхийн тулд кофе, чихэрлэг зүйлсийг ойр ойрхон хэрэглэх шаардлагатай болдог уу?
  - Танд анхаарлаа төвлөрүүлэхэд хэцүү болж, мартамхай эсвэл «толгой манарах» мэдрэмж төрдөг үү?
  - Та уур уцаартай болох, сэтгэл санаа тогтворгүйжих, байнга түгших эсвэл сэтгэл санаа болон мэдрэлийн ядаргаанд орох тохиолдол элбэг байдаг уу?
  - Нойр тань алдагдах эсвэл унтсан ч бүрэн амарч чадаагүй мэт мэдрэмж төрдөг үү?
  - Биедээ ачаалал авч, дасгал хөдөлгөөн хийсний дараа булчин тань агших, өвдөх, хөших эсвэл удаан нөхөн сэргэдэг үү?
  - Та сүүлийн үед өмнөхөөсөө ойр ойрхон өвдөх эсвэл халдварын дараа эдгэрэх нь удааширсныг анзаарч байна уу?
  - Танд арьс хуурайших, хумс хэврэгших эсвэл үсний тань чанар муудаж байгаа нь анзаарагдаж байна уу?
  - Танд хоол идсэний дараа гэдэс дүүрэх, хүнд оргих, өтгөн тогтворгүйжих зэрэг шинж тэмдгүүд байнга анзаарагддаг уу?
  - Танд нүд чилэх, гэрэлд мэдрэмтгий болох эсвэл хараа муудах зэрэг шинж тэмдгүүд анзаарагддаг уу?
  - Танд загас болон хүнсний ногоог бага хэмжээгээр хэрэглэх, стресстэх, хоолны дэглэм барих эсвэл наранд бага гарах зэрэг эрсдэлт хүчин зүйлүүд бий юу?
