questions:
  - Сіз шаршағаныңызды, күш-қуаттың азаюын, сергек болу үшін кофені немесе тәттіні жиі тұтыну қажеттігін сезінесіз бе?
  - Сізде зейін қоюдың қиындауы, ұмытшақтық немесе «бастағы тұман» сезімі байқала ма?
  - Өзіңізден ашушаңдықты, көңіл-күйдің түсуін, мазасыздықты немесе эмоциялық шаршағыштық жиі байқайсыз ба?
  - Ұйқыңыз бұзылған ба немесе ұйқының толыққанды қалыпқа келуіңізге себін тигізбейтінін сезесіз бе?
  - Бұлшық еттеріңіз тартыла ма, аурып, құрысқандай бола ба немесе дене жүктемесінен кейін ұзақ уақыт қалпыңызға келесіз бе?
  - Сіз соңғы кезде жиі ауырасыз ба немесе жұқпалы аурулардан кейін бұрынғыға қарағанда ұзақ уақыт қалпыңызға келесіз бе?
  - Теріңіздің құрғауын, тырнақтарыңыздың сынғыштығын немесе шаш сапасының нашарлағанын байқайсыз ба?
  - Жиі түрде іш кебу, үлкен дәреттің тұрақсыздығын немесе ас қабылдаудан кейін ауырлық сезімін байқайсыз ба?
  - Көзіңіздің шаршауын, жарыққа сезімталдығы артқанын немесе көру қабілетінің төмендегенін байқайсыз ба?
  - 'Сізде мынадай бірнеше тәуекел факторлары бар ма: балық пен көкөністерді сирек тұтыну, күйзеліс, диеталар, күннің астында аз жүру?'
