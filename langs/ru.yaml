last:
  title: Результат диагностики
  retry: Пройти повторно
  buy: Купить
  productDescription: |-
    Nutrilite™ Double Energy – это ключ к заботе о себе и своей семье, поддержанию общего состояния здоровья, повышению уровня энергии.

    Nutrilite™ Double Energy — это системное решение, созданное для комплексной поддержки организма, восстановления ресурса и профилактики дефицитных состояний. Теперь с улучшенной формулой Омега-3 Комплекс Плюс, обеспечивающей более высокую усвояемость и экологичность.

    Эффективность данного подхода была подтверждена в исследовании Научно-исследовательского института профилактической медицины им. академика Е. Д. Даленова.
  results:
    low: По результатам теста, у вас низкий риск наличия дефицитов витаминов и минералов
    medium: По результатам теста, у вас возможные субклинические дефициты витаминов и минералов
    high: По результатам теста, у вас высокая вероятность полидефицита витаминов и минералов
